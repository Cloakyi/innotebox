# Versionen der Abhaengigkeiten fuer alle Module.

[versions]
agp = "9.4.1"
kotlin = "2.4.21"                  # nur noch fuer das Compose-Compiler-Plugin;
                                  # Kotlin selbst bringt AGP 9 mit
ksp = "2.3.12"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
hilt = "2.60.1"                   # MINDESTENS 2.59 -- erst ab da unterstuetzt
                                  # das Hilt-Gradle-Plugin AGP 9. Aeltere
                                  # Versionen brechen mit "Android
                                  # BaseExtension not found".
hiltNavigationCompose = "1.4.0"
navigation = "2.10.2"
datastore = "1.2.1"

room = "2.8.5"                    # Datenbank
workManager = "2.12.0"            # Hintergrundarbeit
hiltWork = "1.4.0"                # Hintergrundarbeit mit Hilt
kotlinxSerialization = "1.11.0"    # JSON fuer Abgleich und Sicherung
kotlinxCoroutines = "1.11.0"
okhttp = "5.5.0"                  # Zugriff auf Google Drive
playServicesAuth = "22.0.0"       # AuthorizationClient
mlkitPrompt = "1.0.0-beta2"       # Titel und Aufbereiten auf dem Geraet. Nicht auf beta3/beta4:
                                  # Ab beta3 fragt die Bibliothek nach einer AICore-Funktion,
                                  # die das Pixel 10 nicht hat (googlesamples/mlkit #1061).
mlkitTranslate = "17.0.3"         # Uebersetzung, laedt Sprachmodelle selbst nach
junit = "4.13.2"
androidxTestCore = "1.7.0"        # Migrationstest
robolectric = "4.17"
# ASM muss neu genug sein, um Klassendateien der laufenden JDK zu lesen.
# Wir bauen mit der JBR 25 aus Android Studio -- deren Klassen haben Major
# Version 69, und das kann erst ASM 9.9. Aeltere Versionen scheitern mit
# "Unsupported class file major version 69", noch bevor ein Test laeuft.
asm = "9.11"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose: Versionen kommen aus der BOM, deshalb ohne version.ref
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

mlkit-genai-prompt = { group = "com.google.mlkit", name = "genai-prompt", version.ref = "mlkitPrompt" }
mlkit-translate = { group = "com.google.mlkit", name = "translate", version.ref = "mlkitTranslate" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

# Datenbank, Hintergrundarbeit, Abgleich und Tests
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
asm = { group = "org.ow2.asm", name = "asm", version.ref = "asm" }
asm-commons = { group = "org.ow2.asm", name = "asm-commons", version.ref = "asm" }
asm-util = { group = "org.ow2.asm", name = "asm-util", version.ref = "asm" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# kotlin-android gibt es hier bewusst NICHT: seit AGP 9.0 bringt das
# Android-Plugin Kotlin selbst mit, und org.jetbrains.kotlin.android ist mit
# der neuen DSL unvereinbar. Wer es wieder eintraegt, bricht den Build.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
