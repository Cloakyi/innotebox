# JVM-Speicher fuer den Gradle-Daemon. 2 GB reichen fuer dieses Projekt.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# Configuration Cache bewusst AUS. Wird eingeschaltet, sobald Hilt/KSP-Setup
# nachweislich sauber durchlaeuft -- nicht vorher, sonst maskiert er Fehler.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
