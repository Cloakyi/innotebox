# Robolectric laeuft standardmaessig mit einer sehr alten, mitgelieferten
# SQLite-Version (sqlite4java). Die kennt weder UPSERT
# (ON CONFLICT ... DO UPDATE, SQLite 3.24 / 2018) noch zuverlaessig den
# unicode61-Tokenizer -- beides benutzen wir, und beides ist auf Android ab
# API 31 laengst vorhanden.
#
# NATIVE bindet stattdessen ein aktuelles SQLite ein. Damit testen wir gegen
# etwas, das dem Geraet aehnelt, statt unseren Code an eine Testumgebung
# anzupassen, die hinterherhinkt.
sqliteMode=NATIVE

# Android 17 (API 37) unterstuetzt Robolectric noch nicht. 34 ist weit genug
# ueber unserem minSdk 31 und deckt alles ab, was die Datenschicht benutzt.
sdk=34
